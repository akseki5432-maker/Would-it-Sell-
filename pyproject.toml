[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "would-it-sell"
version = "0.1.0"
description = "Research an idea on the live web and estimate whether it can make money."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.14", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
would-it-sell = "would_it_sell.cli:main"

[tool.setuptools]
packages = ["would_it_sell"]
